<nav class="site-nav" aria-label="{{ include.label | default: 'Site' }}">
  {%- for item in site.nav %}
  <a href="{{ item.url | relative_url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% unless forloop.last %}<span aria-hidden="true"> · </span>{% endunless %}
  {%- endfor %}
</nav>
