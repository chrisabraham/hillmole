{%- comment -%} « Previous | Beginning | Next » under an entry (include.post). {%- endcomment -%}
<nav class="entry-nav" aria-label="Entries">
  {% if include.post.previous %}<a href="{{ include.post.previous.url | relative_url }}" rel="prev">&laquo; Previous</a> |{% endif %}
  <a href="{{ site.posts.last.url | relative_url }}">Beginning</a>
  {% if include.post.next %}| <a href="{{ include.post.next.url | relative_url }}" rel="next">Next &raquo;</a>{% endif %}
</nav>
