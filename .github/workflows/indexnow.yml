name: IndexNow

on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap (do this once after the DNS move)
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed URLs
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            python3 .github/indexnow.py --all
          else
            python3 .github/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
          fi
