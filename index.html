---
layout: default
---
{%- assign post = site.posts.first -%}
<h1 class="visually-hidden">Hill Mole: a serialized spy novel by Chris Abraham</h1>

<article class="entry">
  <h2{% include entry-id.html post=post %}><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
  <p class="date"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time></p>
  <div class="entry-body">
{{ post.content }}
  </div>
</article>

<nav class="entry-nav" aria-label="Entries">
  {% if post.previous %}<a href="{{ post.previous.url | relative_url }}" rel="prev">&laquo; {{ post.previous.title }}</a> |{% endif %}
  <a href="{{ '/archives.html' | relative_url }}">Archives</a>
</nav>
