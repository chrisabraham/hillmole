title: Hill Mole
tagline: Life is But a Dream
# How the site describes Hill Mole. Every page, feed, schema node and
# llms.txt reads these; nothing else hardcodes a description.
description: >-
  Hill Mole is Chris Abraham's serialized confession novel, written in
  installments from 2005 to 2022 against an espionage backdrop in Washington, DC.
# Home page <title> is "Hill Mole: <title_tagline>"; keep it to 49 characters.
title_tagline: a serialized novel by Chris Abraham
genre: Literary fiction
author_bio: >-
  Chris Abraham came to Washington, DC in 1988 to study at George Washington
  University, set on becoming a senator after attending the Close Up government
  program at sixteen. He worked as a bike courier in the city in 1989 and 1990.
  He started Hill Mole in 2005 in a basement apartment at 14th and A Streets SE,
  and kept writing it through three years in Berlin, a drive around the country,
  and a year in Portland, Oregon. Since 2012 he has lived in South Arlington, off
  Columbia Pike. He loves the Pike more than humanly possible, which makes his
  jetset friends really sad.
author: Chris Abraham
lang: en
first_published: 2005-05-13
image: /podcast/hillMole.png        # square art: favicon, podcast, schema
social_card: /assets/hillmole-card.jpg  # 1200x630 link preview, made from the banner

# The Kindle edition (from the Amazon listing, October 2026).
kindle:
  asin: B0DD7VZJJB
  url: https://www.amazon.com/dp/B0DD7VZJJB             # clean product URL (schema)
  affiliate_url: https://www.amazon.com/dp/B0DD7VZJJB?tag=gerris-20  # Chris' Associates tag
  subtitle: "Life is But a Dream: I Was Merely a Dupe and a Fool"
  date_published: "2024-08-15"
  publisher: Gerris Corp
  edition: 1st
  pages: 67
  blurb: ""

# Chris' profiles elsewhere (author sameAs in the schema).
author_same_as:
  - https://chrisabraham.com/
  - https://www.amazon.com/stores/Chris-Abraham/author/B0GD2HTQYC
  - https://www.linkedin.com/in/chrisabraham
  - https://x.com/chrisabraham
  - https://chrisabraham.substack.com/
  - https://www.reddit.com/user/chrisabraham
  - https://github.com/chrisabraham

# Site menu, shown under the banner and in the footer.
nav:
  - { title: Home, url: / }
  - { title: About, url: /about.html }
  - { title: History, url: /about.html#history }
  - { title: Kindle book, url: /book.html }
  - { title: Archives, url: /archives.html }
  - { title: Colophon, url: /colophon.html }

# IndexNow (Bing, Yandex, Seznam, Naver). The matching <key>.txt sits at the
# site root; .github/workflows/indexnow.yml pings after each push to main.
indexnow_key: 7dd594bffe04697e0e6a936541e67315

# Live on hillmole.com. (The github.io preview used
# url "https://chrisabraham.github.io" and baseurl "/hillmole".)
url: "https://hillmole.com"
baseurl: ""

# Movable Type stamped every entry at a fixed UTC-5 (no DST). Etc/GMT+5 is
# POSIX for UTC-5, so dates and archive days match the old site exactly.
timezone: Etc/GMT+5

# New posts get the old MT URL shape: /archives/YYYY/MM/slug.html
permalink: /archives/:year/:month/:slug.html

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: atom.xml

# MT's monthly, weekly, daily and category archive URLs
collections:
  mtarchives:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  # Indexable: home, entries, and archives.html (the table of contents).
  # MT's monthly, weekly, daily and category pages repeat entry text, so
  # they stay crawlable for links but out of search and the sitemap.
  - scope:
      path: ""
      type: mtarchives
    values:
      robots: "noindex, follow"
      sitemap: false
  # Deleted entries' old pages, served verbatim but not advertised (Chris will decide later).
  - scope: { path: "archives/2008/05/princey_lovey_b.html" }
    values: { sitemap: false }
  - scope: { path: "archives/2008/05/upon_meeting_my.html" }
    values: { sitemap: false }
  - scope: { path: "archives/2008/05/11" }
    values: { sitemap: false }
  - scope: { path: "archives/2008/05/11-week" }
    values: { sitemap: false }
  - scope: { path: "archives/2008/05/26" }
    values: { sitemap: false }
  - scope: { path: "archives/2022/10" }
    values: { sitemap: false }
  - scope: { path: "archives/2023" }
    values: { sitemap: false }
  - scope: { path: "archives/artificial_inte" }
    values: { sitemap: false }
  - scope: { path: "archives/chatgpt" }
    values: { sitemap: false }
  - scope: { path: "archives/google_bard" }
    values: { sitemap: false }
  - scope: { path: "archives/mata_hari" }
    values: { sitemap: false }
  - scope: { path: "archives/prenzlauer_berg" }
    values: { sitemap: false }
  # Host and install leftovers kept only so their old URLs answer.
  - scope: { path: "default.html" }
    values: { sitemap: false }
  - scope: { path: "postinfo.html" }
    values: { sitemap: false }
  - scope: { path: "test.htm" }
    values: { sitemap: false }
  - scope: { path: "GOOGLEe028701e4dbb21d7.html" }
    values: { sitemap: false }
  - scope: { path: "googlee028701e4dbb21d7.html" }
    values: { sitemap: false }

exclude:
  - _migration
  - attic
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - "*.tar.gz"
