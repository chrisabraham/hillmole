---
layout: default
---
<nav class="entry-nav" aria-label="Entries">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}" rel="prev">&laquo; {{ page.previous.title }}</a> |{% endif %}
  <a href="{{ '/' | relative_url }}">Main</a>
  {% if page.next %}| <a href="{{ page.next.url | relative_url }}" rel="next">{{ page.next.title }} &raquo;</a>{% endif %}
</nav>

<article class="entry">
  <h1><a href="{{ page.url | relative_url }}">{{ page.title }}</a></h1>
  {% include byline.html post=page %}
  <div class="entry-body">
{{ content }}
  </div>
</article>

{% include end-nav.html post=page %}
